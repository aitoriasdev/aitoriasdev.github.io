version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
  - package-ecosystem: "npm" # also covers Yarn (yarn.lock)
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
