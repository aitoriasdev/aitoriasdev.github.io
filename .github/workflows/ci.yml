name: CI

on:
  # Any base branch, so stacked PRs (base = another feature branch) are checked too
  pull_request:
    types: [opened, synchronize, reopened]
    paths-ignore:
      - "*.md"
  push:
    branches:
      - main
    paths-ignore:
      - "*.md"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Format, lint, type-check, test & build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Setup Node.js environment
        uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"

      # Uses the Yarn version pinned in package.json#packageManager
      - name: Enable Corepack (Yarn)
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Check formatting (oxfmt)
        run: yarn fmt:check

      - name: Lint (oxlint)
        run: yarn lint --deny-warnings

      - name: Type-check (astro check)
        run: yarn check

      - name: Unit tests (Vitest)
        run: yarn test

      - name: Build
        run: yarn build
